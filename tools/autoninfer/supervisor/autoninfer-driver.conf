[program:autoninfer-driver]
environment=PROC_NAME="%(program_name)s",DURATION_HOURS="30",MAX_ITER="400"
command=/workspace/autoninfer/tools/autoninfer/drive.sh
; Unattended research loop: one headless pi iteration per experiment, fresh
; session per iteration (autoninfer-driver-N). autostart so the loop resumes on
; its own after an instance restart; a clean exit (wall-clock budget, stop
; flag, recorded blocker) is NOT restarted - supervisorctl start to re-arm.
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=90
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0