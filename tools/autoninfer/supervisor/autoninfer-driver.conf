[program:autoninfer-driver]
environment=PROC_NAME="%(program_name)s"
command=/workspace/autoninfer/tools/autoninfer/drive.sh
; Unattended research loop: headless pi iterations on the dedicated
; autoninfer-driver session. Manual start/stop; a clean exit (iteration budget
; or stop flag) is not restarted.
autostart=false
autorestart=unexpected
exitcodes=0
startsecs=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0