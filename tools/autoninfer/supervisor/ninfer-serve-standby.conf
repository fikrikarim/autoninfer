[program:ninfer-serve-standby]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/ninfer-serve-standby.sh
; Bridge serve: started/stopped by the autoninfer_standby extension tool during
; primary restarts only. Never left running (occupies GPU 1).
autostart=false
autorestart=false
exitcodes=0
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0